[project]
name = "data-science-experience"
version = "0.1.0"
description = "Trabalho final de Data Science Experience (MBA): previsão de atraso na entrega com a base Olist"
requires-python = ">=3.13"

# Bibliotecas usadas pelo notebook do trabalho final
dependencies = [
    "pandas>=2.3",
    "numpy>=2.2",
    "matplotlib>=3.10",
    "seaborn>=0.13",
    "scikit-learn>=1.6",
    "optuna>=5.0.0",
    "shap>=0.52.0",
    "kagglehub>=1.0.2",
    "ipykernel>=6.29",
]

[dependency-groups]
# Bibliotecas usadas nas aulas da disciplina (não necessárias para o trabalho).
# Instalação: uv sync --group aulas
aulas = [
    "polars>=1.20",
    "pyarrow>=19",
    "duckdb>=1.1",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "plotly>=6",
    "great-tables>=0.14",
    "statsmodels>=0.14",
    "sweetviz>=2.3.3",
    "geopandas>=1.1.3",
    "folium>=0.20.0",
    "jupyter>=1.1.1",
    "streamlit>=1.58.0",
    "watchdog>=6.0.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "nbconvert[webpdf]>=7.17.1",
    "playwright>=1.62.0",
]

[tool.uv]
package = false
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "PD", "NPY"]
ignore = ["E501"]

[tool.ruff.format]
docstring-code-format = true
